<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Index - RIKY STORE</title>
  <style>
    body { background: #0B1121; color: #F1F5F9; font-family: Inter, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 20px; }
    h1 { color: #2563EB; }
    textarea { width: 100%; height: 400px; background: #1E293B; border: 1px solid #334155; color: white; border-radius: 8px; padding: 10px; font-family: monospace; }
    button { background: #2563EB; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    #status { margin-top: 10px; padding: 10px; border-radius: 6px; }
    .success { background: #14532D; }
    .error { background: #7F1D1D; }
  </style>
</head>
<body>
  <h1>📤 Upload Index.html</h1>
  <p>Tempelkan kode HTML baru untuk mengganti halaman utama.</p>
  
  <form id="uploadForm">
    <textarea id="htmlContent" placeholder="Tempel kode HTML di sini..."></textarea>
    <button type="submit">📨 Simpan ke Firestore</button>
  </form>
  <div id="status"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDcj0yRzKmOxaT1sugTsKhl9-fh2288uCU",
      authDomain: "riky-store-push.firebaseapp.com",
      projectId: "riky-store-push",
      storageBucket: "riky-store-push.firebasestorage.app",
      messagingSenderId: "700709840952",
      appId: "1:700709840952:web:d2efb042652f931d269ecd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const html = document.getElementById('htmlContent').value.trim();
      const status = document.getElementById('status');

      if (!html) {
        status.textContent = '❌ HTML tidak boleh kosong!';
        status.className = 'error';
        return;
      }

      status.textContent = '⏳ Menyimpan...';
      status.className = '';

      try {
        await db.collection('cms').doc('index').set({
          html: html,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        status.textContent = '✅ Berhasil disimpan! Halaman utama akan menggunakan konten baru.';
        status.className = 'success';
      } catch (err) {
        status.textContent = '❌ Gagal simpan: ' + err.message;
        status.className = 'error';
        console.error(err);
      }
    });

    // Isi textarea dengan konten saat ini (opsional)
    async function loadCurrentContent() {
      try {
        const doc = await db.collection('cms').doc('index').get();
        if (doc.exists) {
          document.getElementById('htmlContent').value = doc.data().html || '';
        }
      } catch (e) { /* silent fail */ }
    }
    loadCurrentContent();
  </script>
</body>
</html>

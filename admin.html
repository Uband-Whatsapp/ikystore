<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1120" />
  <title>Admin Push Notif</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080d18;
      --card: #0f1728;
      --card-2: #131d30;
      --border: #22304a;
      --border-focus: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.13), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 10px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.25);
      flex-shrink: 0;
    }

    .bell-icon {
      width: 18px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 10px 10px 6px 6px;
      position: relative;
    }

    .bell-icon::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 3px;
      background: #fff;
      border-radius: 5px;
      left: 50%;
      top: -5px;
      transform: translateX(-50%);
    }

    .bell-icon::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 2px;
      background: #fff;
      border-radius: 5px;
      left: 50%;
      bottom: -5px;
      transform: translateX(-50%);
    }

    h1 {
      font-size: 24px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-left: 59px;
    }

    /* MAIN CARD */
    .card {
      background: rgba(15, 23, 40, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
      backdrop-filter: blur(10px);
    }

    .card-header {
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.09);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .card-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* FORM */
    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 650;
      color: #dbe5f2;
    }

    .label-icon {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.55);
    }

    input,
    textarea {
      width: 100%;
      display: block;
      border: 1px solid var(--border);
      outline: none;
      background: #0a1221;
      color: var(--text);
      border-radius: 11px;
      font-family: inherit;
      font-size: 14px;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    input {
      height: 48px;
      padding: 0 14px;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
      padding: 13px 14px;
      line-height: 1.55;
    }

    input::placeholder,
    textarea::placeholder {
      color: #64748b;
    }

    input:hover,
    textarea:hover {
      border-color: #334766;
    }

    input:focus,
    textarea:focus {
      border-color: var(--border-focus);
      background: #0b1527;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* URL INFO */
    .url-info {
      margin-top: 7px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
    }

    /* BUTTON */
    button {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 5px;
      transition:
        transform 0.15s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.2);
    }

    button:hover {
      filter: brightness(1.08);
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.28);
    }

    button:active {
      transform: scale(0.985);
    }

    .send-icon {
      width: 15px;
      height: 15px;
      border-top: 2px solid #fff;
      border-right: 2px solid #fff;
      transform: rotate(45deg);
      position: relative;
      margin-left: -3px;
    }

    .send-icon::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 2px;
      background: #fff;
      right: -3px;
      top: 9px;
      transform: rotate(-45deg);
      transform-origin: right center;
    }

    /* STATUS */
    #status {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid transparent;
      word-break: break-word;
    }

    #status:not(:empty) {
      display: block;
    }

    .success {
      background: rgba(20, 83, 45, 0.22);
      border-color: rgba(34, 197, 94, 0.22) !important;
      color: #86efac;
    }

    .error {
      background: rgba(127, 29, 29, 0.22);
      border-color: rgba(239, 68, 68, 0.22) !important;
      color: #fca5a5;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      color: #475569;
      font-size: 11px;
      margin-top: 18px;
      line-height: 1.5;
    }

    /* MOBILE */
    @media (max-width: 480px) {
      body {
        padding: 18px 12px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
      }

      h1 {
        font-size: 21px;
      }

      .subtitle {
        margin-left: 55px;
        font-size: 12px;
      }

      .card {
        padding: 17px;
        border-radius: 15px;
      }

      .card-header {
        padding-bottom: 15px;
        margin-bottom: 16px;
      }

      input {
        height: 46px;
      }

      textarea {
        min-height: 105px;
      }

      button {
        height: 48px;
      }
    }
  </style></head><body>  <div class="container"><header class="header">
  <div class="brand">
    <div class="brand-icon">
      <div class="bell-icon"></div>
    </div>

    <h1>Push Notification</h1>
  </div>

  <p class="subtitle">
    Kelola dan kirim notifikasi ke seluruh pengguna yang telah berlangganan.
  </p>
</header>

<main class="card">

  <div class="card-header">
    <div class="card-title">Kirim Notifikasi</div>
    <div class="card-description">
      Masukkan informasi notifikasi yang ingin dikirim kepada pengguna.
    </div>
  </div>

  <form id="pushForm">

    <div class="form-group">
      <label>
        <span class="label-icon"></span>
        Password Admin
      </label>

      <input
        type="password"
        id="adminPassword"
        placeholder="Masukkan password admin"
        autocomplete="current-password"
        required
      />
    </div>

    <div class="form-group">
      <label>
        <span class="label-icon"></span>
        Judul Notifikasi
      </label>

      <input
        type="text"
        id="title"
        placeholder="Masukkan judul notifikasi"
        required
      />
    </div>

    <div class="form-group">
      <label>
        <span class="label-icon"></span>
        Pesan
      </label>

      <textarea
        id="body"
        rows="4"
        placeholder="Tulis isi notifikasi..."
        required
      ></textarea>
    </div>

    <div class="form-group">
      <label>
        <span class="label-icon"></span>
        URL Tujuan
      </label>

      <input
        type="url"
        id="url"
        placeholder="https://lky.store.ekkstore.web.id"
        value="https://lky.store.ekkstore.web.id"
      />

      <div class="url-info">
        Pengguna akan diarahkan ke URL ini saat notifikasi dibuka.
      </div>
    </div>

    <button type="submit">
      <span class="send-icon"></span>
      Kirim ke Semua Pengguna
    </button>

  </form>

  <div id="status"></div>

</main>

<div class="footer">
  Admin Push Notification
</div>

  </div>  <script>
    document.getElementById('pushForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('adminPassword').value.trim();
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();
      const url = document.getElementById('url').value.trim() || 'https://iky.store.ekkstore.web.id';
      const statusDiv = document.getElementById('status');

      if (!password) {
        statusDiv.textContent = '❌ Masukkan password admin!';
        statusDiv.className = 'error';
        return;
      }

      if (!title || !body) {
        statusDiv.textContent = '❌ Isi judul dan pesan!';
        statusDiv.className = 'error';
        return;
      }

      statusDiv.textContent = '⏳ Mengirim...';
      statusDiv.className = '';

      try {
        const res = await fetch('/api/send-notification', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': password
          },
          body: JSON.stringify({ title, body, url })
        });

        const text = await res.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch (err) {
          statusDiv.textContent = '❌ Server error: ' + text.substring(0, 100);
          statusDiv.className = 'error';
          console.error('Response bukan JSON:', text);
          return;
        }

        if (res.ok) {

          // ===== TAMPILKAN JUMLAH PERANGKAT =====
          if (data.total !== undefined) {
            const success = data.success || data.total;

            statusDiv.textContent =
              `✅ Pesan berhasil dikirim ke ${success} perangkat dari ${data.total} subscriber.`;
          } else {
            statusDiv.textContent =
              '✅ ' + (data.message || 'Berhasil dikirim!');
          }

          statusDiv.className = 'success';

        } else {

          statusDiv.textContent =
            '❌ Gagal: ' + (data.error || 'unknown error');

          statusDiv.className = 'error';
        }

      } catch (err) {

        statusDiv.textContent =
          '❌ Error jaringan: ' + err.message;

        statusDiv.className = 'error';
      }
    });
  </script></body>
</html>

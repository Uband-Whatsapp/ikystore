<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIKY STORE</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- Konten akan diisi oleh JavaScript dari Firestore -->
  <div id="app">Memuat konten...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDcj0yRzKmOxaT1sugTsKhl9-fh2288uCU",
      authDomain: "riky-store-push.firebaseapp.com",
      projectId: "riky-store-push",
      storageBucket: "riky-store-push.firebasestorage.app",
      messagingSenderId: "700709840952",
      appId: "1:700709840952:web:d2efb042652f931d269ecd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Konten HTML cadangan (jika tidak ada di Firestore)
    const FALLBACK_HTML = `
      <div style="padding:20px;text-align:center;font-family:sans-serif;background:#0B1121;color:#F1F5F9;min-height:100vh;">
        <h1 style="color:#2563EB;">RIKY STORE</h1>
        <p>Konten belum diupload. Silakan upload melalui <a href="/upload-file" style="color:#60A5FA;">/upload-file</a></p>
        <p style="font-size:12px;color:#94A3B8;">© RIKY STORE</p>
      </div>
    `;

    async function loadContent() {
      const app = document.getElementById('app');
      try {
        const doc = await db.collection('cms').doc('index').get();
        if (doc.exists && doc.data().html) {
          app.innerHTML = doc.data().html;
        } else {
          app.innerHTML = FALLBACK_HTML;
        }
      } catch (err) {
        console.error('Gagal muat konten:', err);
        app.innerHTML = FALLBACK_HTML;
      }
    }

    loadContent();
  </script>
</body>
</html>
